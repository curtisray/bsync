name: Tests

on:
  push:
    branches: [main]
  pull_request:
  workflow_call:

permissions:
  contents: read

jobs:
  test:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest]
        python: ['3.10', '3.14']
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: ${{ matrix.python }}
      - name: Install modern rsync
        run: |
          if [ "$RUNNER_OS" = macOS ]; then
            brew install rsync
          else
            sudo apt-get update
            sudo apt-get install -y rsync
          fi
      - run: python -m pip install .
      - name: Verify required transfer engine
        run: python -c 'import bsync; print(bsync.find_rsync())'
      - run: python -m unittest discover -s tests -v
      - name: Smoke test installed entry point outside the checkout
        working-directory: ${{ runner.temp }}
        run: |
          bsync --version
          bsync --help
