[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "bsync"
version = "0.2.0"
description = "Rsync with live progress, durable history, and interruption recovery"
readme = "README.md"
requires-python = ">=3.10"
dependencies = ["rich>=13.7,<15"]

[project.scripts]
bsync = "bsync:main"

[tool.setuptools]
py-modules = ["bsync", "bsync_ui", "bsync_sessions"]
