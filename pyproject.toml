[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[project]
name = "better-rsync"
dynamic = ["version"]
description = "Rsync with live progress, durable history, and interruption recovery"
readme = "README.md"
requires-python = ">=3.10"
dependencies = ["rich>=13.7,<15"]
license = "MIT"
license-files = ["LICENSE"]
keywords = ["rsync", "backup", "transfer", "tui", "cli"]
classifiers = [
  "Development Status :: 4 - Beta",
  "Environment :: Console",
  "Operating System :: MacOS",
  "Operating System :: POSIX :: Linux",
  "Programming Language :: Python :: 3 :: Only",
  "Programming Language :: Python :: 3.10",
  "Programming Language :: Python :: 3.11",
  "Programming Language :: Python :: 3.12",
  "Programming Language :: Python :: 3.13",
  "Programming Language :: Python :: 3.14",
  "Topic :: System :: Archiving :: Backup",
]

[project.urls]
Homepage = "https://github.com/curtisray/bsync"
Repository = "https://github.com/curtisray/bsync"
Issues = "https://github.com/curtisray/bsync/issues"
Releases = "https://github.com/curtisray/bsync/releases"

[project.scripts]
bsync = "bsync:main"

[tool.setuptools]
py-modules = ["bsync", "bsync_ui", "bsync_sessions"]

[tool.setuptools.dynamic]
version = {attr = "bsync.__version__"}
